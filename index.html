<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Dynamic Activities - Sherwin Candinato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>JavaScript Dynamic Activities</h1>
        <p><strong>This is Sherwin's JavaScript Activities</strong></p>
    </header>

    <!-- 1. Random Background -->
    <section>
        <h2>1. Random Background Color</h2>
        <button id="colorBtn">Change Background</button>
        <button id="resetBtn">Return to Normal</button>
    </section>

    <!-- 2. Dark Mode -->
    <section>
        <h2>2. Dark Mode Toggle</h2>
        <button id="darkModeBtn">Enable Dark Mode</button>
    </section>

    <!-- 3. Add List Item -->
    <section>
        <h2>3. Add List Item</h2>
        <input type="text" id="itemInput" placeholder="Enter item">
        <button id="addItemBtn">Add Item</button>
        <button id="removeItemBtn">Remove Last Item</button>
        <ul id="myList"></ul>
    </section>

    <!-- 4. Add & Remove Paragraph -->
    <section>
        <h2>4. Add and Remove Paragraph</h2>
        <button id="addParaBtn">Add Paragraph</button>
        <button id="removeParaBtn">Remove Paragraph</button>
        <div id="paraContainer"></div>
    </section>

    <!-- 5. Character Counter -->
    <section>
        <h2>5. Character Counter</h2>
        <input type="text" id="textInput" placeholder="Type anything...">
        <p>Characters: <span id="charCount">0</span></p>
    </section>

    <!-- 6. Addition Calculator -->
    <section>
        <h2>6. Addition Calculator</h2>
        <input type="number" id="num1" placeholder="First number">
        <input type="number" id="num2" placeholder="Second number">
        <button id="addBtn">Add</button>
        <p>Result: <span id="result">0</span></p>
    </section>
